name: PEMESA Android validation
on:
  push:
    branches: [pemesa-improvements]
  pull_request:
    branches: [pemesa-improvements, main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pemesa-build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Set up Android command-line tools
        uses: android-actions/setup-android@v3
      - name: Prepare Android SDK
        run: |
          rm -f local.properties app/local.properties wear/local.properties
          sdkmanager "platforms;android-36" "build-tools;35.0.0"
          chmod +x gradlew
      - name: Compile and run JVM tests for both modules
        run: ./gradlew --no-daemon :app:assembleDebug :wear:assembleDebug :app:testDebugUnitTest :wear:testDebugUnitTest
